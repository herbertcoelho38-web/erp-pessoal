<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ERP de Pessoas · Danlex</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* Padrão Danlex: faixa vermelha, fundo grafite, filtros na lateral esquerda, cartões escuros com marcador vermelho */
:root{
  --bg:#0b0b0b; --panel:#141414; --surface:#1a1a19; --surface-2:#252524; --line:#313130; --ink:#f3f2ef; --muted:#a3a19c;
  --red:#e20d1f; --red-hi:#ed1729; --red-mid:#c50c1b; --red-deep:#7a1b24; --red-soft:rgba(226,13,31,.16); --red-line:rgba(226,13,31,.55);
  --blue:#4472c4; --orange:#ed7d31; --good:#3fbf7f; --good-soft:rgba(63,191,127,.15); --gray:#5a5955; --amber:#e3b341;
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:12px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--f-body);font-variant-numeric:tabular-nums;margin:0}
.page{max-width:1500px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
b,strong{font-weight:700}

.hero{position:relative;overflow:hidden;border-radius:14px;color:#fff;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 46px),linear-gradient(100deg,var(--red-hi) 0%,var(--red-mid) 55%,var(--red-deep) 100%);
  padding:18px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.mark{display:flex;flex-direction:column;line-height:1;flex:none}
.mark b{font-family:var(--f-display);font-size:34px;letter-spacing:.06em;font-weight:700}
.mark span{font-size:11px;letter-spacing:.42em;margin-top:5px;opacity:.9;font-weight:700}
.hero .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.3);flex:none}
.hero .txt{flex:1 1 360px;min-width:0}
.hero .eyebrow{opacity:.85}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:29px;line-height:1.1;margin:4px 0 6px}
.hero p{margin:0;font-size:14px;max-width:80ch;opacity:.95}
.badge{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);border-radius:10px;padding:10px 16px;text-align:center;flex:none}
.badge b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600}
.badge span{font-size:12px;opacity:.85}

.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
aside.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;padding:12px}
.side .tog{display:none}
.sec{padding:12px 2px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec:first-of-type{border-top:0;padding-top:2px}
.role{display:flex;flex-direction:column;gap:3px;background:var(--surface-2);border-radius:8px;padding:9px 10px;font-size:12px;color:var(--muted)}
.role strong{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px}
.role strong i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px var(--red-soft);flex:none}
.role.ro strong i{background:var(--muted);box-shadow:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:700;font-size:13.5px;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--red-line)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red-hi)}
.btn.ghost{background:transparent;border-color:var(--red-line);color:#fff}
.btn.ghost:hover{background:var(--red-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.segm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--red-line);border-radius:8px;overflow:hidden}
.segm button{border:0;border-right:1px solid var(--red-line);border-bottom:1px solid var(--red-line);background:transparent;padding:7px 0;font-size:12.5px;font-weight:700;margin:0 -1px -1px 0}
.segm button.on{background:var(--red);color:#fff}
.segm button:hover:not(.on){background:var(--red-soft)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
.pill:hover{border-color:var(--red-line)}
.pill.on{background:var(--red);border-color:var(--red);color:#fff}
.linkb{border:0;background:none;color:#ff6b74;font-weight:700;font-size:12.5px;padding:0;text-align:left}
input[type=date],input[type=text],input[type=email],select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px}
input:focus,select:focus{border-color:var(--red-line);outline:none}
.search{position:relative}
.search input{padding-left:28px}
.search svg{position:absolute;left:8px;top:9px;width:14px;height:14px;color:var(--muted)}
.search.big input{padding:11px 12px 11px 36px;font-size:15px;border-radius:10px}
.search.big svg{left:12px;top:13px;width:17px;height:17px}
.sugg{position:absolute;left:0;right:-140px;top:100%;margin-top:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 30px -10px #000;max-height:340px;overflow:auto;z-index:40}
.search.big .sugg{right:0}
.sugg button{display:flex;flex-direction:column;width:100%;padding:7px 10px;border:0;background:none;text-align:left}
.sugg button:hover,.sugg button.on{background:var(--red-soft)}
.sugg small{color:var(--muted);font-size:11.5px}
.clist{max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.clist label{display:flex;gap:7px;align-items:center;padding:4px 4px;border-radius:5px;font-size:12.5px;cursor:pointer}
.clist label:hover{background:var(--surface-2)}
.clist label em{margin-left:auto;font-style:normal;color:var(--muted);font-size:11px}
.clist input,.chk input{accent-color:var(--red)}
.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 3px 2px 10px;border-radius:999px;background:var(--red-soft);border:1px solid var(--red-line);font-size:12px;font-weight:700}
.chip button{border:0;background:none;width:18px;height:18px;border-radius:50%;padding:0;color:#ffb3b8;line-height:1}

.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:5px}
.tabs button{border:0;background:none;padding:8px 13px;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tabs button:hover{color:var(--ink);background:var(--surface-2)}
.tabs button.on{background:var(--red);color:#fff}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-size:25px;font-weight:500;line-height:1.15;margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.lead{background:linear-gradient(135deg,var(--red-hi),var(--red-mid));border-color:var(--red);color:#fff}
.kpi.lead .k,.kpi.lead small{color:#fff;opacity:.9}

.content{display:flex;flex-direction:column;gap:16px;min-width:0}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.card h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:8px;height:8px;background:var(--red);border-radius:1px;transform:skewX(-12deg);flex:none}
.card header p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg2{display:inline-flex;border:1px solid var(--red-line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg2 button{border:0;background:transparent;padding:5px 11px;font-size:12.5px;font-weight:700}
.seg2 button.on{background:var(--red);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.note{font-size:12px;color:var(--muted)}
.notice{background:var(--surface-2);border-left:3px solid var(--amber);border-radius:8px;padding:10px 12px;font-size:13px}
.notice.red{border-left-color:var(--red)}

.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:520px;height:auto}
.hb{display:flex;flex-direction:column;gap:7px}
.hbr{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:12.5px;border:0;background:none;padding:2px 0;text-align:left;width:100%}
.hbr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbr .t{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hbr .t i{display:block;height:100%;background:var(--blue)}
.hbr.on .t i,.hbr.hot .t i{background:var(--red)}
.hbr b{text-align:right;font-size:12.5px}
button.hbr:hover span:first-child{color:#ff6b74}
.stbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin:8px 0}
.stbar i{display:block;height:100%}

.tbx{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:72vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);position:sticky;top:0;z-index:2}
th button{border:0;background:none;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;padding:0}
th.r,td.r{text-align:right}
td.wrapc{white-space:normal;min-width:240px;max-width:420px;color:var(--muted)}
tbody tr:hover td{background:var(--surface-2)}
tr.hot td{background:var(--red-soft)}
tr.hot td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.tp{display:inline-block;min-width:30px;text-align:center;padding:1px 6px;border-radius:4px;background:var(--red);color:#fff;font-weight:700;font-size:10.5px;margin-right:6px}
.lnk{border:0;background:none;padding:0;font-weight:700;text-align:left}
.lnk:hover{color:#ff6b74;text-decoration:underline}
.st{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted);border:0}
.st.ok{background:var(--good-soft);color:var(--good)}
.st.no{background:var(--red-soft);color:#ff6b74}
.st.wa{background:rgba(227,179,65,.15);color:var(--amber)}
button.st{cursor:pointer}
button.st:hover{outline:1px solid var(--red-line)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pager div{display:flex;gap:6px}

/* grade de presença */
.pgrid{font-size:12px}
.pgrid th,.pgrid td{padding:0;border-right:1px solid var(--line)}
.pgrid th{padding:5px 3px;text-align:center;font-size:10.5px;letter-spacing:0}
.pgrid th.we{color:#ff8a92}
.pgrid td.fx,.pgrid th.fx{position:sticky;background:var(--surface);z-index:1;padding:5px 8px;text-align:left}
.pgrid th.fx{background:var(--surface-2);z-index:3}
.pgrid td.f1,.pgrid th.f1{left:0;min-width:64px}
.pgrid td.f2,.pgrid th.f2{left:64px;min-width:210px;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.pgrid td.tot{padding:5px 8px;text-align:right}
.cd{width:34px;min-width:34px;height:28px;text-align:center;font-weight:700;font-size:10.5px;position:relative}
.cd.ed{cursor:pointer}
.cd.ed:hover{outline:2px solid var(--red-hi);outline-offset:-2px}
.cd.mod::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:#fff}
.c-OK{background:rgba(63,191,127,.18);color:#7fe0ad}
.c-DSR{background:#2a2a29;color:#8f8d88}
.c-FOLGA{background:#2b3140;color:#9fb3d9}
.c-FALTA{background:#b10f1d;color:#fff}
.c-ATEST{background:rgba(237,125,49,.3);color:#ffb27d}
.c-FERIAS{background:rgba(68,114,196,.35);color:#b8cdf5}
.c-BH{background:rgba(160,104,219,.3);color:#d7b6ff}
.c-AFAST{background:rgba(227,179,65,.25);color:#f3d27a}
.c-DESL{background:#050505;color:#ff6b74}
.c-CURSO{background:rgba(32,178,170,.25);color:#7ee0d9}
.c-MANUT{background:rgba(32,178,170,.15);color:#a7e8e3}
.c-ETN{background:rgba(32,150,200,.22);color:#9fd8f5}
.c-ABAND{background:#6e0710;color:#fff}
.c-SUSPE{background:#8d1a68;color:#fff}
.c-X{background:var(--surface-2);color:var(--ink)}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.codes button{border:1px solid var(--line);border-radius:7px;padding:6px 6px;font-weight:700;font-size:12px;text-align:left;display:flex;flex-direction:column;gap:1px}
.codes button small{font-weight:500;opacity:.8;font-size:11px}
.codes button.on{outline:2px solid #fff;outline-offset:-2px}

/* lançamento do dia */
.dl{display:flex;flex-direction:column;gap:6px}
.dlr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;background:var(--surface-2);border-radius:9px;padding:8px 10px;border-left:3px solid transparent}
.dlr.pend{border-left-color:var(--amber)}
.dlr .who strong{display:block;font-size:13.5px}
.dlr .who span{font-size:11.5px;color:var(--muted)}
.qb{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.qb button{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-weight:700;font-size:11.5px;background:var(--surface)}
.qb button:hover{border-color:var(--red-line)}
.qb button.on{outline:2px solid #fff;outline-offset:-2px}
.qb select{width:auto;padding:4px 6px;font-size:12px}
.stb{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stb button{border:0;background:none;padding:5px 9px;font-size:11.5px;font-weight:700}
.stb button.on.a{background:var(--good);color:#06150d}
.stb button.on.i{background:var(--red);color:#fff}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-family:var(--f-display);font-size:24px;margin-bottom:6px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;z-index:90;max-width:calc(100% - 32px)}
.toast.ok{background:#1f7a4f}

.ovl{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:calc(40px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:680px;border:1px solid var(--line);overflow:hidden}
.modal .mh{background:linear-gradient(100deg,var(--red-hi),var(--red-deep));padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;color:#fff}
.modal .mh h2{font-family:var(--f-display);font-size:23px;font-weight:600}
.modal .mb{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.x{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:26px 16px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over,.drop:hover{border-color:var(--red-line);background:var(--red-soft)}
.drop strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.chk input{margin-top:3px}
.err{background:var(--red-soft);border:1px solid var(--red-line);color:#ffb3b8;padding:10px 12px;border-radius:8px;font-weight:700;font-size:13px}
.okmsg{background:var(--good-soft);color:var(--good);padding:10px 12px;border-radius:8px;font-weight:700;font-size:13px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pop{position:fixed;z-index:75;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px -12px #000;padding:12px;width:min(380px,calc(100vw - 24px))}
.pop h4{margin:0 0 8px;font-size:13px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--panel);z-index:70;border-left:1px solid var(--line);overflow:auto;box-shadow:-20px 0 40px -20px #000}
.drawer .dh{background:linear-gradient(100deg,var(--red-hi),var(--red-deep));color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 16px 18px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer .dh h2{font-family:var(--f-display);font-size:24px;font-weight:600}
.drawer .db{padding:16px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px}
.dk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dk div{background:var(--surface);border-left:3px solid var(--red);border-radius:8px;padding:10px;min-width:0}
.dk b{display:block;font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsec{margin-top:18px}
.dsec h3{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.dsec h3::before{content:"";width:7px;height:7px;background:var(--red);border-radius:1px;transform:skewX(-12deg)}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dgrid div{background:var(--surface);padding:8px 10px;min-width:0}
.dgrid span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.dgrid b{display:block;font-size:13px;font-weight:600;overflow-wrap:anywhere}
.strip{display:flex;gap:2px;flex-wrap:wrap}
.strip i{width:16px;height:16px;border-radius:3px;font-style:normal;font-size:8.5px;display:grid;place-items:center;font-weight:700}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:700}
.form .full{grid-column:1/-1}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.bgrid label{flex-direction:row;align-items:center;gap:7px;color:var(--ink);font-weight:500;font-size:12.5px}
.perm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.perm div{background:var(--surface-2);border-radius:9px;padding:12px;font-size:12.5px;color:var(--muted)}
.perm b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.side{position:static;max-height:none}
  .side .tog{display:flex;width:100%;justify-content:space-between}
  .side:not(.open) .sec.fx{display:none}
  .sugg{right:0}
  .dk{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .perm{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){.kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:20px}.hero{padding:16px}.hero h1{font-size:23px}.hero .sep{display:none}.hbr{grid-template-columns:minmax(0,100px) minmax(0,1fr) 80px}.form{grid-template-columns:minmax(0,1fr)}.dlr{grid-template-columns:minmax(0,1fr)}.qb{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.form .seg2{align-self:flex-start}

.dates{display:grid;grid-template-columns:1fr;gap:6px}
.dates label{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.dates label input{flex:1}

.pper{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--surface-2);border-radius:9px;padding:10px 12px}
.pper label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700}
.pper input{width:auto}
.pgrid .ms{border-left:2px solid var(--red-line)}
.cd.na{background:repeating-linear-gradient(135deg,#151515 0 4px,#1d1d1c 4px 8px)}

</div>

function genCode(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='',r=new Uint32Array(8);try{crypto.getRandomValues(r)}catch(e){for(var i=0;i<8;i++)r[i]=Math.floor(Math.random()*1e9)}for(var j=0;j<8;j++)s+=a[r[j]%a.length];return s.slice(0,4)+'-'+s.slice(4)}

function resolveRole(){
  var me=S.me||{},users=(S.acc&&S.acc.users)||[],u=null;
  if(me.id)u=users.filter(function(x){return x.id&&x.id===me.id})[0];
  if(!u&&me.email)u=users.filter(function(x){return x.email&&x.email.toLowerCase()===me.email.toLowerCase()})[0];
  var code=lsGet('erp_codigo')||S._memCode||'';if(!u&&code)u=users.filter(function(x){return x.codigo&&x.codigo===code})[0];
  if(S.owner)return {perfil:'master',bases:'*',nome:me.name||'Proprietário',owner:true};
  if(!u)return null;
  var b=u.perfil==='master'?'*':(u.bases&&u.bases.indexOf('*')>=0?'*':(u.bases||[]));
  return {perfil:u.perfil,bases:b,nome:u.nome||me.name||'',rec:u,viaCode:!!(code&&u.codigo===code&&!(me.id&&u.id===me.id)&&!(me.email&&u.email&&u.email.toLowerCase()===me.email.toLowerCase()))};
}

function qHit(o){var f=S.f,q=nk(f.q),qd=f.q.replace(/\D/g,'');if(!f.q)return true;
  if(qd&&/^\s*\d+\s*$/.test(f.q))return o.m.indexOf(qd)===0;return o.nk.indexOf(q)>=0}
function passC(o,skip){var f=S.f;if(!o||!inScope(o.base))return false;
  if(f.colab){if(o.k!==f.colab)return false}else if(!qHit(o))return false;
  if(skip!=='bases'&&f.bases.size&&!f.bases.has(o.base))return false;
  if(skip!=='sit'&&f.sit&&o.sit!==f.sit)return false;
  if(skip!=='deps'&&f.deps.size&&!f.deps.has(o.dep))return false;return true}
function passR(r,skip){var f=S.f,o=S.D.C[r.ck];if(!inScope(r.b))return false;
  if(skip!=='bases'&&f.bases.size&&!f.bases.has(r.b))return false;
  if(f.colab){if(r.ck!==f.colab)return false}else if(f.q&&!qHit(o))return false;
  if(skip!=='sit'&&f.sit&&o.sit!==f.sit)return false;
  if(skip!=='deps'&&f.deps.size&&!f.deps.has(o.dep))return false;return true}
function hasPer(){return !!(S.f.de||S.f.ate)}
function dayIn(d){var f=S.f;return (!f.de||d>=f.de)&&(!f.ate||d<=f.ate)}
function monthIn(m){var f=S.f;return (!f.de||m+'-31'>=f.de)&&(!f.ate||m+'-01'<=f.ate)}
function dayIdx(p){var a=[];p.dias.forEach(function(d,j){if(dayIn(d))a.push(j)});return a}
function perTxt(){var f=S.f;return f.de&&f.ate?dbr(f.de)+' a '+dbr(f.ate):f.de?'a partir de '+dbr(f.de):'até '+dbr(f.ate)}

function colabs(skip){var C=S.D.C;return Object.keys(C).map(function(k){return C[k]}).filter(function(o){return passC(o,skip)})}
function cntFor(o,ms){var t={};if(!hasPer()){ms.forEach(function(m){if(o.pm[m])addCnt(t,o.pm[m])});return t}
  (o.rows||[]).forEach(function(x){if(ms.indexOf(x.mes)>=0)addCnt(t,rowCnt(x.r))});return t}

var queue={};
function enqueue(id,fn){var p=(queue[id]||Promise.resolve()).then(fn,fn);queue[id]=p.catch(function(){});return p}
function lancBase(mes,r){var id=lid(mes,r.k),cur=S.lanc[id];return {id:id,doc:cur?JSON.parse(JSON.stringify(cur)):{mes:mes,k:r.k,m:r.m||'',b:r.b,d:{}}}}
function writeLanc(id,doc,prev){S.lanc[id]=doc;build();render();
  return enqueue(id,function(){return S.db.doc('lanc/'+id).set(doc)}).catch(function(err){if(prev)S.lanc[id]=prev;else delete S.lanc[id];build();render();
    toast(err&&(err.code==='permission_denied'||err.code==='invalid_argument'||err.code==='not_granted')?'Sem permissão para salvar. Verifique seu acesso ao ERP.':'Não foi possível salvar. Tente novamente.');throw err})}
function saveCode(mes,r,j,c){if(!canEditRow(r)||!S.db)return Promise.resolve();var x=lancBase(mes,r),prev=S.lanc[x.id],dia=S.D.pres[mes].dias[j];
  x.doc.d=x.doc.d||{};x.doc.d[dia]={c:c,u:S.me&&S.me.id||'',n:myName(),t:new Date().toISOString()};x.doc.b=r.b;return writeLanc(x.id,x.doc,prev)}
function saveStatus(mes,r,v){if(!canEditRow(r)||!S.db)return;var x=lancBase(mes,r),prev=S.lanc[x.id];x.doc.st={v:v,u:S.me&&S.me.id||'',n:myName(),t:new Date().toISOString()};writeLanc(x.id,x.doc,prev).then(function(){toast(title(r.n)+': '+v,'ok')},function(){})}
